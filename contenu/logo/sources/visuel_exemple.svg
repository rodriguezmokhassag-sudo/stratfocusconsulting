<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
<defs><style>
@font-face { font-family:'Bebas'; src:url('fonts/BebasNeue.ttf'); }
.cond{font-family:'Bebas'} .tag{font-family:'Liberation Sans',Arial,sans-serif}
</style></defs>
<rect width="1080" height="1080" fill="#0D2B6E"/>

<!-- motif cible en filigrane -->
<g opacity="0.07" fill="none" stroke="#FFFFFF"><circle cx="900" cy="300" r="260" stroke-width="22"/><circle cx="900" cy="300" r="170" stroke-width="22"/><circle cx="900" cy="300" r="80" stroke-width="22"/></g>
<!-- étiquette pilier -->
<rect x="80" y="150" rx="28" width="380" height="56" fill="#C9A84C"/>
<text x="270" y="190" text-anchor="middle" class="tag" font-size="28" font-weight="bold" fill="#0D2B6E">CHIFFRE D'AFFAIRES</text>
<!-- titre -->
<text class="cond" font-size="120" fill="#FFFFFF"><tspan x="80" y="390">POURQUOI BAISSER</tspan><tspan x="80" y="505">VOS PRIX</tspan><tspan x="80" y="620" fill="#C9A84C">EST DANGEREUX</tspan></text>

<text x="80" y="720" class="tag" font-size="34" fill="#EDF0F7">L'erreur qui détruit vos marges et comment l'éviter</text>
<!-- bandeau bas -->
<rect x="0" y="860" width="1080" height="220" fill="#08204F"/>
<g transform="translate(40,895) scale(0.40)">
  
  <!-- Cible -->
  <circle cx="218" cy="222" r="124" fill="none" stroke="#FFFFFF" stroke-width="7"/>
  <path d="M 140 190 A 84 84 0 1 0 296 190" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" transform="rotate(8 218 222)"/>
  <path d="M 183 146 A 80 80 0 0 1 252 146" fill="none" stroke="#C9A84C" stroke-width="5" stroke-linecap="round"/>
  <!-- Fléchette -->
  <polygon points="333,58 368,86 291,158 276,150" fill="#FFFFFF"/>
  <!-- S -->
  <text x="216" y="272" text-anchor="middle" class="cond" font-size="136" fill="#FFFFFF">S</text>
  <!-- Nom -->
  <text x="356" y="272" class="cond" font-size="136" textLength="1068" lengthAdjust="spacing"><tspan fill="#FFFFFF">TRAT FOCUS </tspan><tspan fill="#C9A84C">CONSULTING</tspan></text>
  <!-- Signature -->
  <text x="366" y="324" class="tag" font-size="55" textLength="1056" lengthAdjust="spacing">
    <tspan fill="#C9A84C">Parce que</tspan><tspan fill="#FFFFFF"> votre chiffre d'affaires compte</tspan>
  </text>
</g>
<text x="1020" y="985" text-anchor="end" class="tag" font-size="32" font-weight="bold" fill="#C9A84C">WhatsApp 066 000 066</text>
</svg>